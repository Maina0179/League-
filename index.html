<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League</title>
<style>
  :root { --ink: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #2f6fed; --danger: #c0392b; --bg: #f6f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; margin: 8px 0; } h2 { font-size: 1.2rem; margin: 0 0 8px; } h3 { font-size: 1rem; margin: 18px 0 6px; }
  a { color: var(--accent); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
  input, select, textarea, button { font: inherit; padding: 8px 10px; border: 1px solid #cfd4dc; border-radius: 8px; background: #fff; }
  input, select, textarea { width: 100%; }
  input.small-input { width: 70px; text-align: center; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid #cfd4dc; }
  button.danger { background: var(--danger); }
  button.link { background: none; border: none; color: var(--accent); padding: 0; }
  label { display: block; font-size: 0.9rem; color: var(--muted); }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--ink); }
  label.check input { width: auto; }
  .muted { color: var(--muted); } .small { font-size: 0.85rem; }
  .code { font-family: ui-monospace, monospace; letter-spacing: 2px; font-size: 1.1rem; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .tabs button { background: #fff; color: var(--ink); border: 1px solid #cfd4dc; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 8px; border-bottom: 1px solid #eef0f3; text-align: left; font-size: 0.95rem; }
  th { background: #f0f2f5; }
  td.c { text-align: center; font-weight: 600; white-space: nowrap; }
  .fixture { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #eef0f3; }
  .fixture .names { flex: 1; min-width: 160px; }
  .badge { font-size: 0.75rem; background: #eef2ff; color: #3949ab; border-radius: 999px; padding: 2px 8px; margin-left: 8px; }
  .league-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eef0f3; }
  .league-item:last-child { border-bottom: none; }
  #toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); }
  .toast { background: #1d2330; color: #fff; padding: 10px 14px; border-radius: 8px; margin-top: 6px; font-size: 0.9rem; }
  .toast.error { background: var(--danger); }
  .auth { max-width: 380px; margin: 40px auto; }

  /* ---------- theme ---------- */
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbe7ff 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #ffe3f1 0%, transparent 55%),
      #f4f6fb;
    min-height: 100vh;
  }
  main { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  h1 {
    font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #2f6fed, #8e44ec 55%, #ff5fa2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { font-weight: 700; }
  .card {
    border: none; border-radius: 16px; padding: 18px;
    box-shadow: 0 6px 24px rgba(34, 52, 104, .08), 0 1px 3px rgba(0, 0, 0, .04);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { box-shadow: 0 10px 30px rgba(34, 52, 104, .12); }
  input, select, textarea {
    border: 1.5px solid #dfe3ee; border-radius: 12px; padding: 10px 12px; transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #8e44ec; box-shadow: 0 0 0 4px rgba(142, 68, 236, .15);
  }
  button {
    background: linear-gradient(135deg, #2f6fed, #8e44ec); border-radius: 12px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(47, 111, 237, .25); transition: transform .15s ease, box-shadow .2s ease, filter .2s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(142, 68, 236, .3); filter: brightness(1.05); }
  button:active { transform: scale(.97); }
  button.ghost {
    background: #fff; color: #2b3450; border: 1.5px solid #dfe3ee; box-shadow: none;
  }
  button.ghost:hover { background: #f5f7ff; border-color: #b9c4f5; box-shadow: none; }
  button.danger { background: linear-gradient(135deg, #ff5f6d, #c0392b); box-shadow: 0 4px 14px rgba(192, 57, 43, .25); }
  button.link { background: none; box-shadow: none; color: #2f6fed; }
  button.link:hover { transform: none; box-shadow: none; text-decoration: underline; filter: none; }
  .tabs { gap: 8px; }
  .tabs button {
    background: #fff; color: #4a5470; border: 1.5px solid #e4e8f2; border-radius: 999px; padding: 8px 16px; box-shadow: none;
  }
  .tabs button.active {
    background: linear-gradient(135deg, #2f6fed, #8e44ec); color: #fff; border-color: transparent;
    box-shadow: 0 6px 16px rgba(142, 68, 236, .3);
  }
  .tabs button:hover { transform: translateY(-1px); }
  table { border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(34, 52, 104, .08); }
  th { background: #f1f4fc; color: #4a5470; font-size: .85rem; text-transform: uppercase; letter-spacing: .4px; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: #f7f9ff; }
  tr.rank-1 td { background: linear-gradient(90deg, #fff6d6, #fffdf3); font-weight: 700; }
  tr.rank-2 td { background: linear-gradient(90deg, #eef1f6, #fafbfd); }
  tr.rank-3 td { background: linear-gradient(90deg, #fbe9da, #fff9f4); }
  .medal { font-size: 1.1rem; margin-right: 4px; }
  .fixture {
    border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #eef0f7; background: #fff;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .fixture:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(34, 52, 104, .08); }
  .fixture .names { font-weight: 600; }
  .fixture strong { background: #eef2ff; color: #3b3fbf; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .badge {
    background: linear-gradient(135deg, #e7f0ff, #f3e8ff); color: #5b3fd0; font-weight: 600; padding: 3px 10px;
  }
  .league-item { border-radius: 12px; padding: 12px; margin-bottom: 6px; transition: background .15s; }
  .league-item:hover { background: #f5f7ff; }
  .code {
    display: inline-block; background: linear-gradient(135deg, #2f6fed, #8e44ec); color: #fff;
    border-radius: 10px; padding: 4px 12px; letter-spacing: 3px;
  }
  .toast { border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); animation: slideUp .3s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .auth { margin-top: 56px; }
  .auth h1 { text-align: center; font-size: 2.6rem; }
  .muted { color: #6b7388; }

  /* ---------- intro: the drawn boy runs in along a curve, the ball flies to the front of the title ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 1000; overflow: hidden;
    background: linear-gradient(160deg, #2f6fed 0%, #8e44ec 55%, #ff5fa2 100%);
    transition: opacity .6s ease, visibility .6s;
  }
  #intro.gone { opacity: 0; visibility: hidden; }
  #intro .title {
    position: absolute; left: 0; right: 0; top: 30%; text-align: center; margin: 0;
    font-size: clamp(2.4rem, 9vw, 4.5rem); font-weight: 800; color: #fff; letter-spacing: -1px;
    background: none; -webkit-text-fill-color: #fff; text-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  }
  #intro .player { position: absolute; left: -60vw; top: 92vh; width: min(62vw, 300px); }
  #intro .player img { display: block; width: 100%; user-select: none; -webkit-user-drag: none; }
  #intro.run:not(.play) .player { animation: bob .35s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  /* A white ball sits exactly where the drawn ball was removed, so it takes off from there. */
  #intro .ball-x {
    position: absolute; left: 16.85%; top: 82.1%; width: 23.4%;
    margin-left: -11.7%; margin-top: -11.7%;
  }
  #intro .ball-y { width: 100%; height: 100%; }
  #intro.play .ball-y { animation: spin 1.1s linear both; }
  @keyframes spin { to { transform: rotate(900deg); } }
  #intro .skip {
    position: absolute; right: 16px; top: 16px; background: rgba(255, 255, 255, .2);
    box-shadow: none; border: 1px solid rgba(255, 255, 255, .5); color: #fff; padding: 6px 12px; font-size: .85rem;
  }
  #intro .skip:hover { background: rgba(255, 255, 255, .3); transform: none; box-shadow: none; filter: none; }

  /* ---------- curtain: drops over the page for sign-in, rolls up to reveal the next page ---------- */
  #curtain {
    position: fixed; inset: 0; z-index: 900; overflow-y: auto;
    transform: translateY(-102%); transition: transform 1.1s cubic-bezier(.22, .8, .25, 1);
    background: repeating-linear-gradient(90deg, #4d1a9a 0 34px, #6a2cc8 34px 62px, #4d1a9a 62px 96px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  }
  #curtain.down { transform: translateY(0); }
  #curtain .rod {
    position: sticky; top: 0; z-index: 2; height: 14px;
    background: linear-gradient(#ffe38a, #c9962a); box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
  }
  #curtain .valance {
    height: 84px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#7a3be0, #5b22b8); border-bottom: 8px solid #f5c451;
    color: #fff; font-weight: 800; font-size: 1.4rem; letter-spacing: .5px;
  }
  #curtainStage { max-width: 420px; margin: 0 auto; padding: 18px 16px 60px; }
  #curtainStage h1 { color: #fff; -webkit-text-fill-color: #fff; background: none; text-align: center; }
  #curtainStage .auth { margin-top: 8px; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Intro: plays once per browser session, and never when reduced motion is on.
(function () {
  const intro = document.getElementById('intro');
  window.introDone = new Promise((resolve) => { window.__introResolve = resolve; });
  const finish = () => {
    intro.classList.add('gone');
    sessionStorage.setItem('intro-seen', '1');
    window.__introResolve();
  };
  if (sessionStorage.getItem('intro-seen') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    intro.remove();
    window.__introResolve();
    return;
  }
  document.getElementById('introSkip').addEventListener('click', finish);
  const player = document.getElementById('player');
  const ballX = document.getElementById('ballX');
  const word = document.getElementById('titleWord');
  const vw = innerWidth / 100, vh = innerHeight / 100;

  // The drawn boy: a curve from off-screen bottom-left, up and round, to his place.
  const P0 = { x: -60 * vw, y: 92 * vh }, P1 = { x: -8 * vw, y: 40 * vh }, P2 = { x: 4 * vw, y: 34 * vh };
  const bez = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
  const RUN = 1400, FLY_AT = 1500, FLY = 1100;

  intro.classList.add('run');
  player.style.left = P0.x + 'px';
  player.style.top = P0.y + 'px';
  let flying = false, B0, T, C;
  const t0 = performance.now();
  function frame(now) {
    const e = now - t0;
    const u = Math.min(1, e / RUN);
    player.style.left = bez(P0.x, P1.x, P2.x, u) + 'px';
    player.style.top = bez(P0.y, P1.y, P2.y, u) + 'px';
    if (e >= FLY_AT) {
      if (!flying) {
        // Measured once the boy has stopped: the ball on his picture, and the front of the title.
        flying = true;
        const b = ballX.getBoundingClientRect();
        B0 = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
        const w = word.getBoundingClientRect();
        T = { x: w.left - 22, y: w.top + w.height * 0.5 };
        C = { x: (B0.x + T.x) / 2 - 40, y: Math.min(B0.y, T.y) - 170 };
        intro.classList.remove('run');
        intro.classList.add('play');
      }
      const v = Math.min(1, (e - FLY_AT) / FLY);
      ballX.style.transform = `translate(${bez(B0.x, C.x, T.x, v) - B0.x}px, ${bez(B0.y, C.y, T.y, v) - B0.y}px)`;
    }
    if (e < FLY_AT + FLY) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(finish, 3600);
})();
</script>
<script>
// ---------- 1. Paste your Firebase project settings here (Project settings > Your apps > Config) ----------
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAWo2aHvs3gRdwePThDAWvDl0A2jKpdt30',
  authDomain: 'my-league-2b5ec.firebaseapp.com',
  projectId: 'my-league-2b5ec',
  storageBucket: 'my-league-2b5ec.firebasestorage.app',
  messagingSenderId: '468316071730',
  appId: '1:468316071730:web:0d8a7b0b53131537a1192b',
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;
const leagues = () => db.collection('leagues');

// LOGIC START (pure functions, no page access; tested separately)
const WIN = 3, DRAW = 1, LOSS = 0;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const teamName = (l, id) => l.teams.find((t) => t.id === id)?.name ?? '?';

function roundRobin(ids) {
  const list = [...ids];
  if (list.length % 2) list.push(null);
  const n = list.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = list[i], b = list[n - 1 - i];
      if (a && b) pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    list.splice(1, 0, list.pop());
  }
  return rounds;
}

function hasResults(l) { return l.fixtures.some((f) => f.hg !== null || f.ag !== null); }

function addKnockoutRound(l, round, entrants) {
  for (let i = 0; i < entrants.length; i += 2) {
    const a = entrants[i], b = entrants[i + 1];
    if (a && b) {
      l.fixtures.push({ id: uid(), round, home: a, away: b, hg: null, ag: null, goals: [], bye: false, winnerId: null });
    } else {
      const only = a || b;
      l.fixtures.push({ id: uid(), round, home: only, away: null, hg: null, ag: null, goals: [], bye: true, winnerId: only });
    }
  }
}

function buildKnockout(l) {
  const ids = l.teams.map((t) => t.id);
  const size = 2 ** Math.ceil(Math.log2(ids.length));
  const byes = size - ids.length;
  const entrants = [];
  for (let i = 0; i < byes; i++) entrants.push(ids[i], null);
  entrants.push(...ids.slice(byes));
  addKnockoutRound(l, 1, entrants);
  advanceKnockout(l);
}

/** Returns a fresh fixture list for the league's teams and format. Does not touch the league. */
function makeFixtures(l) {
  const tmp = { ...l, fixtures: [] };
  if (tmp.teams.length < 2) return [];
  if (tmp.format === 'knockout') { buildKnockout(tmp); return tmp.fixtures; }
  const rounds = roundRobin(tmp.teams.map((t) => t.id));
  const legs = tmp.format === 'double' ? [rounds, rounds.map((r) => r.map(([h, a]) => [a, h]))] : [rounds];
  let matchday = 0;
  for (const leg of legs) {
    for (const pairs of leg) {
      matchday++;
      for (const [home, away] of pairs) {
        tmp.fixtures.push({ id: uid(), round: matchday, home, away, hg: null, ag: null, goals: [], bye: false, winnerId: null });
      }
    }
  }
  return tmp.fixtures;
}

function fixtureDecided(l, f) {
  if (f.bye) return true;
  if (f.hg === null || f.ag === null) return false;
  return l.format !== 'knockout' || Boolean(f.winnerId);
}

/** When a knockout round is fully decided, creates the next round from its winners. Stops at the final. */
function advanceKnockout(l) {
  if (l.format !== 'knockout') return;
  for (let round = 1; ; round++) {
    const fx = l.fixtures.filter((f) => f.round === round);
    if (!fx.length || fx.length === 1) return;
    if (!fx.every((f) => fixtureDecided(l, f))) return;
    if (!l.fixtures.some((f) => f.round === round + 1)) {
      addKnockoutRound(l, round + 1, fx.map((f) => f.winnerId));
    }
  }
}

function knockoutSummary(l) {
  const outRound = new Map();
  for (const f of l.fixtures) {
    if (!f.bye && fixtureDecided(l, f)) outRound.set(f.winnerId === f.home ? f.away : f.home, f.round);
  }
  const finalRound = l.fixtures.length ? Math.max(...l.fixtures.map((f) => f.round)) : null;
  const final = l.fixtures.filter((f) => f.round === finalRound);
  const champion = final.length === 1 && fixtureDecided(l, final[0]) ? teamName(l, final[0].winnerId) : null;
  return {
    champion,
    stillIn: l.teams.filter((t) => !outRound.has(t.id)).map((t) => t.name),
    out: [...outRound].map(([id, round]) => ({ name: teamName(l, id), round })),
  };
}

/** Owner or any admin can edit. */
const isAdmin = (l, uid) => Boolean(uid) && (l.ownerId === uid || (l.admins || []).includes(uid));

/** The link anyone can open to land on this league's overview. */
const shareUrl = (l) => `${location.origin}${location.pathname}#/code/${l.code}`;

const roundComplete = (l, r) => l.fixtures.filter((f) => f.round === r).every((f) => fixtureDecided(l, f));

function currentRound(l) {
  const rounds = [...new Set(l.fixtures.map((f) => f.round))].sort((a, b) => a - b);
  return rounds.find((r) => !roundComplete(l, r)) ?? null;
}

const isOpen = (l, f) => { const c = currentRound(l); return c === null || f.round <= c; };

/** Sets one fixture's score. Mutates l. Throws with a readable message if the order is wrong. */
function setResult(l, f, hg, ag, winnerId = null) {
  if ((hg === null) !== (ag === null)) throw new Error('Enter both scores, or clear both');
  const c = currentRound(l);
  if (c !== null && f.round > c) throw new Error(`Matchday ${c} must be completed before matchday ${f.round} opens`);
  if (hg === null && l.fixtures.some((x) => x.round > f.round && x.hg !== null)) {
    throw new Error('Clear the results of later matchdays first');
  }
  if (l.format === 'knockout') {
    if (f.bye) throw new Error('A bye has no score');
    if (l.fixtures.some((x) => x.round > f.round)) throw new Error('Later rounds already depend on this result');
    if (hg === null) f.winnerId = null;
    else if (hg !== ag) f.winnerId = hg > ag ? f.home : f.away;
    else if (winnerId === f.home || winnerId === f.away) f.winnerId = winnerId;
    else throw new Error('Choose who advances after a draw');
  }
  f.hg = hg;
  f.ag = ag;
}

function table(l) {
  const rows = new Map(l.teams.map((t) => [t.id, { id: t.id, name: t.name, p: 0, w: 0, d: 0, lo: 0, gf: 0, ga: 0, pts: 0 }]));
  for (const f of l.fixtures) {
    if (f.hg === null || f.ag === null || f.bye) continue;
    const h = rows.get(f.home), a = rows.get(f.away);
    if (!h || !a) continue;
    h.p++; a.p++;
    h.gf += f.hg; h.ga += f.ag; a.gf += f.ag; a.ga += f.hg;
    if (f.hg > f.ag) { h.w++; a.lo++; h.pts += WIN; a.pts += LOSS; }
    else if (f.hg < f.ag) { a.w++; h.lo++; a.pts += WIN; h.pts += LOSS; }
    else { h.d++; a.d++; h.pts += DRAW; a.pts += DRAW; }
  }
  return [...rows.values()]
    .map((r) => ({ ...r, gd: r.gf - r.ga }))
    .sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name));
}

function scorers(l) {
  const byKey = new Map();
  for (const f of l.fixtures) {
    for (const g of f.goals) {
      const key = `${g.scorer.toLowerCase()}|${g.teamId}`;
      if (!byKey.has(key)) byKey.set(key, { name: g.scorer, team: teamName(l, g.teamId), goals: 0 });
      byKey.get(key).goals++;
    }
  }
  return [...byKey.values()].sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
}
// LOGIC END

  const rounds = [...new Set(l.fixtures.map((f) => f.round))].sort((a, b) => a - b);

      : isOpen(l, list[0]) ? 'Open for results' : `Locked until matchday ${r - 1} is complete`;
    const label = l.format === 'knockout' ? (list.length === 1 ? 'Final' : `Round ${r}`) : `Matchday ${r}`;
    return `<h3>${label}<span class="badge">${status}</span></h3>${list.map((f) => fixtureHtml(f, owner)).join('')}`;
  }).join('');
  return `${formatTools}${sections}`;
}

function fixtureHtml(f, owner) {
  const l = cur;
  if (f.bye) return `<div class="fixture"><span class="names">${esc(teamName(l, f.home))}</span><span class="muted">Bye</span></div>`;
  const played = f.hg !== null && f.ag !== null;
  const through = l.format === 'knockout' && f.winnerId ? ` · ${esc(teamName(l, f.winnerId))} through` : '';
  const scoreText = played ? `${f.hg} – ${f.ag}${through}` : 'Not played';
  const open = isOpen(l, f);
  const scoreForm = owner && open ? `
    <form data-form="score" data-fid="${esc(f.id)}" class="row">
      <input class="small-input" name="hg" type="number" min="0" max="99" value="${played ? f.hg : ''}" aria-label="${esc(teamName(l, f.home))} score">
      <span>–</span>
      <input class="small-input" name="ag" type="number" min="0" max="99" value="${played ? f.ag : ''}" aria-label="${esc(teamName(l, f.away))} score">
      ${l.format === 'knockout' ? `<select name="winner" style="width:auto"><option value="">Winner if drawn</option>
        <option value="${esc(f.home)}" ${f.winnerId === f.home ? 'selected' : ''}>${esc(teamName(l, f.home))}</option>
        <option value="${esc(f.away)}" ${f.winnerId === f.away ? 'selected' : ''}>${esc(teamName(l, f.away))}</option></select>` : ''}
      <button type="submit" class="ghost">Save</button>
    </form>` : '';
  const goals = f.goals.map((g) => `
    <span class="small">⚽ ${esc(g.scorer)} (${esc(teamName(l, g.teamId))})
      ${owner ? `<button class="link" data-action="del-goal" data-fid="${esc(f.id)}" data-gid="${esc(g.id)}">×</button>` : ''}</span>`).join(' ');
  const goalForm = owner && played ? `
    <form data-form="goal" data-fid="${esc(f.id)}" class="row small">
      <input name="scorer" placeholder="Scorer" maxlength="40" required style="width:auto">
      <select name="teamId" style="width:auto">
        <option value="${esc(f.home)}">${esc(teamName(l, f.home))}</option>
        <option value="${esc(f.away)}">${esc(teamName(l, f.away))}</option>
      </select>
      <button type="submit" class="ghost">Add goal</button>
    </form>` : '';
  return `
    <div class="fixture" style="flex-direction:column;align-items:stretch">
      <div class="row"><span class="names">${esc(teamName(l, f.home))} vs ${esc(teamName(l, f.away))}</span>
        <strong>${scoreText}</strong></div>
      ${scoreForm}
      ${goals ? `<div>${goals}</div>` : ''}
      ${goalForm}
    </div>`;
}

function scorersTab() {
  const list = scorers(cur);
  if (!list.length) return '<p class="muted">No goals recorded yet.</p>';
  return `<table><thead><tr><th>Player</th><th>Team</th><th>Goals</th></tr></thead>
    <tbody>${list.map((x, i) => `<tr class="${i === 0 ? 'rank-1' : ''}"><td>${i === 0 ? '🏆 ' : ''}${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.goals}</td></tr>`).join('')}</tbody></table>`;
}

function rulesTab() {
  const l = cur;
  if (!isAdmin(l, auth.currentUser?.uid)) {
    return `<div style="white-space:pre-wrap">${l.rules ? esc(l.rules) : '<span class="muted">No rules set.</span>'}</div>`;
  }
  return `
    <form data-form="rules" class="stack">
      <textarea name="rules" rows="10" maxlength="5000">${esc(l.rules)}</textarea>
      <button type="submit">Save rules</button>
    </form>`;
}

function adminsTab() {
  const l = cur;
  const me = auth.currentUser?.uid;
  const isOwner = l.ownerId === me;
  const names = l.adminNames || {};
  const list = (l.admins || []).map((a) => `
    <li class="row" style="justify-content:space-between">
      <span>${esc(names[a] || 'Admin')} <span class="muted small">${esc(a)}</span></span>
      ${isOwner ? `<button class="link danger-text" data-action="remove-admin" data-uid="${esc(a)}">Remove</button>` : ''}
    </li>`).join('');
  return `
    <p class="small">Owner: <strong>${esc(l.ownerName || 'Owner')}</strong></p>
    <ul style="padding-left:18px">${list || '<li class="muted small">No other admins yet.</li>'}</ul>
    ${isOwner ? `
      <h3>Add an admin</h3>
      <form data-form="addadmin" class="stack">
        <input name="uid" placeholder="Admin's user ID (they find it on their dashboard)" required maxlength="128">
        <input name="name" placeholder="Admin's name" required maxlength="40">
        <button type="submit">Add admin</button>
      </form>` : '<p class="muted small">Only the owner can add or remove admins.</p>'}
    <p class="small muted" style="margin-top:14px">Your user ID: <input readonly value="${esc(me)}" onclick="this.select()" style="font-size:.8rem"></p>`;
}

function teamsTab() {
  const l = cur;
  const canEdit = isAdmin(l, auth.currentUser?.uid);
  const hasRes = hasResults(l);
  const rows = l.teams.map((t) => canEdit
    ? `<li class="row" style="margin-bottom:8px">
         <form data-form="renameteam" data-tid="${esc(t.id)}" class="row" style="flex:1">
           <input name="name" value="${esc(t.name)}" maxlength="40" required style="flex:1;min-width:140px">
           <button type="submit" class="ghost">Save name</button>
         </form>
         ${hasRes ? '' : `<button class="link danger-text" data-action="del-team" data-tid="${esc(t.id)}">Remove</button>`}
       </li>`
    : `<li>${esc(t.name)}</li>`).join('');
  return `
    <ul style="padding-left:18px;list-style:none">${rows}</ul>
    ${canEdit && !hasRes ? `
      <form data-form="addteam" class="row">
        <input name="name" placeholder="Add a team" maxlength="40" required style="width:auto">
        <button type="submit" class="ghost">Add team</button>
      </form>` : canEdit ? '<p class="muted small">Results are in, so you can rename teams but not add or remove them.</p>' : ''}`;
}

// ---------- 4. Writing to the database (owner only; Firestore rules enforce it) ----------
async function saveFixtures(patch) {
  await leagues().doc(cur.id).update(patch);
}

function requireCurrent() {
  if (!cur) throw new Error('Open a league first');
  return cur;
}

const forms = {
  login: async (f) => {
    const d = new FormData(f);
    await auth.signInWithEmailAndPassword(d.get('email'), d.get('password'));
  },
  signup: async (f) => {
    const d = new FormData(f);
    const cred = await auth.createUserWithEmailAndPassword(d.get('email'), d.get('password'));
    await cred.user.updateProfile({ displayName: d.get('name').trim() });
  },
  create: async (f) => {
    const d = new FormData(f);
    const user = auth.currentUser;
    const name = d.get('name').trim();
    const playing = d.get('playing') === 'on';
    const league = {
      name,
      nameLower: name.toLowerCase(),
      code: Math.random().toString(36).slice(2, 8).toUpperCase(),
      rules: (d.get('rules') || '').trim(),
      format: d.get('format'),
      ownerId: user.uid,
      ownerName: user.displayName || user.email,
      teams: [],
      fixtures: [],
      followers: [],
      admins: [],
      adminNames: {},
    };
    if (playing) {
      const own = (d.get('teamName') || '').trim();
      if (!own) throw new Error('Enter your team name');
      league.teams.push({ id: uid(), name: own });
    }
    for (const t of (d.get('teams') || '').split('\n').map((s) => s.trim()).filter(Boolean)) {
      league.teams.push({ id: uid(), name: t });
    }
    if (league.teams.length < 2) throw new Error('Add at least two teams');
    league.fixtures = makeFixtures(league);
    const ref = await leagues().add(league);
    location.hash = `#/league/${ref.id}`;
    toast(`League created. Share this code with members: ${league.code}`);
  },
  find: async (f) => {
    const q = new FormData(f).get('q').trim();
    const qLower = q.toLowerCase();
    const [byName, byCode] = await Promise.all([
      leagues().where('nameLower', '>=', qLower).where('nameLower', '<=', qLower + '').limit(10).get(),
      leagues().where('code', '==', q.toUpperCase()).limit(1).get(),
    ]);
    const found = new Map();
    byName.forEach((d) => found.set(d.id, d));
    byCode.forEach((d) => found.set(d.id, d));
    const out = document.getElementById('findResults');
    const me = auth.currentUser?.uid ?? null;
    out.innerHTML = found.size
      ? [...found.values()].map((d) => {
        const l = d.data();
        const mine = !me || l.ownerId === me || (l.admins || []).includes(me) || (l.followers || []).includes(me);
        return `<div class="league-item">
          <span><strong>${esc(l.name)}</strong> <span class="muted small">code ${esc(l.code)} · ${l.teams.length} teams</span></span>
          ${mine ? `<a href="#/league/${esc(d.id)}">Open</a>`
            : `<button class="ghost" data-action="follow" data-id="${esc(d.id)}">Follow</button>`}
        </div>`;
      }).join('')
      : '<p class="muted small">No league matches that name or code.</p>';
  },
  score: async (f) => {
    const l = requireCurrent();
    const copy = JSON.parse(JSON.stringify(l));
    const fx = copy.fixtures.find((x) => x.id === f.dataset.fid);
    const d = new FormData(f);
    const hg = whole(d.get('hg')), ag = whole(d.get('ag'));
    setResult(copy, fx, hg, ag, d.get('winner') || null);
    advanceKnockout(copy);
    await saveFixtures({ fixtures: copy.fixtures });
  },
  goal: async (f) => {
    const l = requireCurrent();
    const copy = JSON.parse(JSON.stringify(l));
    const fx = copy.fixtures.find((x) => x.id === f.dataset.fid);
    const d = new FormData(f);
    const scorer = d.get('scorer').trim();
    if (!scorer) throw new Error('Enter the scorer name');
    fx.goals.push({ id: uid(), scorer, teamId: d.get('teamId') });
    await saveFixtures({ fixtures: copy.fixtures });
  },
  format: async (f) => {
    const l = requireCurrent();
    if (hasResults(l)) throw new Error('Results have been entered, so the format is locked');
    const copy = { ...l, format: new FormData(f).get('format') };
    await saveFixtures({ format: copy.format, fixtures: makeFixtures(copy) });
  },
  addteam: async (f) => {
    const l = requireCurrent();
    if (hasResults(l)) throw new Error('Results have been entered, so teams are locked');
    const teams = [...l.teams, { id: uid(), name: new FormData(f).get('name').trim() }];
    await saveFixtures({ teams, fixtures: makeFixtures({ ...l, teams }) });
  },
  renameteam: async (f) => {
    const l = requireCurrent();
    if (!isAdmin(l, auth.currentUser?.uid)) throw new Error('Only admins can rename teams');
    const name = new FormData(f).get('name').trim();
    if (!name) throw new Error('Enter a team name');
    const teams = l.teams.map((t) => (t.id === f.dataset.tid ? { ...t, name } : t));
    await saveFixtures({ teams });
    toast('Team renamed');
  },
  rules: async (f) => {
    const l = requireCurrent();
    await saveFixtures({ rules: new FormData(f).get('rules').trim() });
    toast('Rules saved');
    return l;
  },
};

forms.addadmin = async (f) => {
  const l = requireCurrent();
  if (l.ownerId !== auth.currentUser?.uid) throw new Error('Only the owner can add admins');
  const d = new FormData(f);
  const adminUid = d.get('uid').trim();
  const name = d.get('name').trim();
  if (!adminUid || adminUid === l.ownerId) throw new Error('That user ID cannot be an admin');
  await leagues().doc(l.id).update({
    admins: FieldValue.arrayUnion(adminUid),
    ['adminNames.' + adminUid]: name,
  });
  toast('Admin added');
};

const actions = {
  'remove-admin': async (btn) => {
    const l = requireCurrent();
    if (l.ownerId !== auth.currentUser?.uid) throw new Error('Only the owner can remove admins');
    await leagues().doc(l.id).update({
      admins: FieldValue.arrayRemove(btn.dataset.uid),
      ['adminNames.' + btn.dataset.uid]: FieldValue.delete(),
    });
  },
  logout: () => { sessionStorage.removeItem('guest'); return auth.signOut(); },
  guest: () => { sessionStorage.setItem('guest', '1'); location.hash = '#/'; route(); },
  'exit-guest': () => { sessionStorage.removeItem('guest'); showAuth(); },
  follow: async (btn) => {
    const id = btn.dataset.id;
    await leagues().doc(id).update({ followers: FieldValue.arrayUnion(auth.currentUser?.uid) });
    location.hash = `#/league/${id}`;
  },
  unfollow: async () => {
    const l = requireCurrent();
    await leagues().doc(l.id).update({ followers: FieldValue.arrayRemove(auth.currentUser?.uid) });
    location.hash = '#/';
  },
  'delete-league': async () => {
    const l = requireCurrent();
    if (!confirm('Delete this league and all its results? This cannot be undone.')) return;
    await leagues().doc(l.id).delete();
    location.hash = '#/';
  },
  tab: (btn) => { tab = btn.dataset.tab; renderLeague(); },
  'del-goal': async (btn) => {
    const l = requireCurrent();
    const copy = JSON.parse(JSON.stringify(l));
    const fx = copy.fixtures.find((x) => x.id === btn.dataset.fid);
    fx.goals = fx.goals.filter((g) => g.id !== btn.dataset.gid);
    await saveFixtures({ fixtures: copy.fixtures });
  },
  'del-team': async (btn) => {
    const l = requireCurrent();
    if (hasResults(l)) throw new Error('Results have been entered, so teams are locked');
    const teams = l.teams.filter((t) => t.id !== btn.dataset.tid);
    await saveFixtures({ teams, fixtures: makeFixtures({ ...l, teams }) });
  },
};

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const handler = forms[form.dataset.form];
  try {
    await handler(form);
  } catch (err) {
    toast(err.message || 'Something went wrong', true);
  }
});

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  try {
    await actions[btn.dataset.action](btn);
  } catch (err) {
    toast(err.message || 'Something went wrong', true);
  }
});

// ---------- 5. Routing and live updates ----------
async function route() {
  const user = auth.currentUser;
  if (user) sessionStorage.removeItem('guest');
  const codeMatch = location.hash.match(/^#\/code\/([^/]+)$/);
  if (codeMatch && !user) sessionStorage.setItem('guest', '1'); // a share link opens without sign-in
  const guest = !user && sessionStorage.getItem('guest') === '1';
  if (!user && !guest) return showAuth();
  if (codeMatch) {
    try {
      const found = await leagues().where('code', '==', codeMatch[1].toUpperCase()).limit(1).get();
      if (found.empty) {
        toast('No league has that code', true);
        location.hash = '#/';
      } else {
        location.hash = `#/league/${found.docs[0].id}`; // the hash change opens the overview
      }
    } catch (err) {
      toast(err.message, true);
    }
    raiseCurtain();
    return;
  }
  const m = location.hash.match(/^#\/league\/([^/]+)$/);
  if (!m) {
    try {
      if (user) await dashboard(user); else guestDashboard();
    } catch (err) {
      toast(err.message || 'Could not load leagues', true);
    } finally {
      raiseCurtain();
    }
    return;
  }

  unsubLeague?.();
  unsubLeague = leagues().doc(m[1]).onSnapshot((doc) => {
    if (!doc.exists) {
      toast('That league no longer exists', true);
      location.hash = '#/';
      return;
    }
    cur = { id: doc.id, ...doc.data() };
    renderLeague();
    raiseCurtain();
  }, (err) => toast(err.message, true));
}

auth.onAuthStateChanged(() => route());
window.addEventListener('hashchange', () => route());
</script>
</body>
</html>
